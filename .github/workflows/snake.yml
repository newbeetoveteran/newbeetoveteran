name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: newbeetoveteran
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23ff0000&color_dots=%230d1117,%235c2e00,%23ffcc99,%23ff0000,%23ffd700
            dist/snake-dark.svg?palette=github-dark&color_snake=%23ff0000&color_dots=%230d1117,%235c2e00,%23ffcc99,%23ff0000,%23ffd700

      - name: Deploy to branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
